<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Weddings Review</title>
<!-- Review page for the Three Weddings storyline and key frames: reads src/cinema/WEDDINGS_STORY.md and
     outputs/civ-weddings-keyframes/frames.json (written by scripts/render-civ-keyframes.mjs --set=weddings). -->
<style>
  :root { --bg: #f6f3ec; --panel: #ffffff; --ink: #1f1d1a; --muted: #6b665d; --line: #e2dccf; --accent: #c2410c; --chip: #fff1e6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15171b; --panel: #1d2026; --ink: #ece8e0; --muted: #a39d92; --line: #30343c; --accent: #fb923c; --chip: #2a2420; } }
  :root[data-theme="dark"] { --bg: #15171b; --panel: #1d2026; --ink: #ece8e0; --muted: #a39d92; --line: #30343c; --accent: #fb923c; --chip: #2a2420; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
  nav button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  #story { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 28px 28px; }
  #story h1 { font-size: 28px; } #story h2 { margin-top: 32px; border-bottom: 1px solid var(--line); padding-bottom: 4px; } #story h3 { color: var(--muted); }
  #story table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
  #story td, #story th { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
  #story code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: zoom-in; }
  figure img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
  figcaption { padding: 8px 12px 12px; font-size: 14px; }
  figcaption b { color: var(--accent); margin-right: 6px; } figcaption span { color: var(--muted); font-size: 12px; margin-left: 6px; }
  #box { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 5; padding: 16px; }
  #box.on { display: flex; } #box img { max-width: 100%; max-height: 82vh; border-radius: 8px; }
  #box p { color: #eee; margin: 12px 0 0; text-align: center; } #box small { color: #aaa; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Three Islands, Three Weddings · review</h1>
  <nav><button data-view="story" aria-pressed="true">Storyline</button> <button data-view="frames" aria-pressed="false">Key frames</button></nav>
</header>
<main>
  <article id="story">Loading the storyline…</article>
  <section id="frames" hidden><div class="grid" id="grid"></div></section>
</main>
<div id="box" role="dialog" aria-modal="true"><img alt=""><p></p><small>← → to step · Esc to close</small></div>
<script>
const DIR = '/outputs/civ-weddings-keyframes/', bust = '?v=' + Date.now();
// a small Markdown reader: headings, lists, tables, bold, italics, code and paragraphs (what the storyline uses)
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>');
function md(text) {
  const out = [], lines = text.split(/\r?\n/); let list = 0, para = [];
  const flush = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const close = (to = 0) => { while (list > to) { out.push('</ul>'); list--; } };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*$/.test(l)) { flush(); close(); continue; }
    let m;
    if ((m = l.match(/^(#{1,3}) (.*)/))) { flush(); close(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if (/^---+$/.test(l)) { flush(); close(); out.push('<hr>'); continue; }
    if (l.startsWith('|')) {
      flush(); close(); const rows = [];
      for (; i < lines.length && lines[i].startsWith('|'); i++) if (!/^\|[-| ]+\|$/.test(lines[i])) rows.push(lines[i].slice(1, -1).split('|').map(c => inline(c.trim())));
      i--; out.push('<table>' + rows.map((r, k) => '<tr>' + r.map(c => k ? `<td>${c}</td>` : `<th>${c}</th>`).join('') + '</tr>').join('') + '</table>'); continue;
    }
    if ((m = l.match(/^(\s*)- (.*)/))) {
      flush(); const depth = Math.floor(m[1].length / 2) + 1;
      while (list < depth) { out.push('<ul>'); list++; } close(depth);
      let item = m[2]; while (i + 1 < lines.length && /^\s{2,}\S/.test(lines[i + 1]) && !/^\s*- /.test(lines[i + 1])) item += ' ' + lines[++i].trim();
      out.push('<li>' + inline(item) + '</li>'); continue;
    }
    if (list && /^\s{2,}\S/.test(l)) { out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, ' ' + inline(l.trim()) + '</li>'); continue; }
    close(); para.push(l.trim());
  }
  flush(); close(); return out.join('\n');
}
fetch('/src/cinema/WEDDINGS_STORY.md' + bust).then(r => r.text()).then(t => { document.getElementById('story').innerHTML = md(t); });

let frames = [], at = 0;
const box = document.getElementById('box');
function show(i) { at = (i + frames.length) % frames.length; const f = frames[at]; box.querySelector('img').src = DIR + f.id + '.png' + bust; box.querySelector('p').textContent = `${f.id} · ${f.title}${f.time ? ' · ' + f.time : ''}`; box.classList.add('on'); }
fetch(DIR + 'frames.json' + bust).then(r => r.json()).then(list => {
  frames = [...list.filter(f => !f.id.startsWith('cast')), ...list.filter(f => f.id.startsWith('cast'))];
  document.getElementById('grid').innerHTML = frames.map((f, i) => `<figure data-i="${i}"><img loading="lazy" src="${DIR + f.id}.png${bust}" alt="${esc(f.title)}"><figcaption><b>${esc(f.id.split('-')[0])}</b>${esc(f.title)}${f.time ? `<span>${f.time}</span>` : ''}</figcaption></figure>`).join('');
});
document.getElementById('grid').addEventListener('click', e => { const f = e.target.closest('figure'); if (f) show(+f.dataset.i); });
box.addEventListener('click', e => { if (e.target === box) box.classList.remove('on'); });
addEventListener('keydown', e => { if (!box.classList.contains('on')) return; if (e.key === 'Escape') box.classList.remove('on'); if (e.key === 'ArrowRight') show(at + 1); if (e.key === 'ArrowLeft') show(at - 1); });
function view(v) { for (const b of document.querySelectorAll('nav button')) b.setAttribute('aria-pressed', b.dataset.view === v); document.getElementById('story').hidden = v !== 'story'; document.getElementById('frames').hidden = v !== 'frames'; try { localStorage.setItem('weddings-view', v); } catch {} }
document.querySelector('nav').addEventListener('click', e => { if (e.target.dataset.view) view(e.target.dataset.view); });
try { const v = new URLSearchParams(location.search).get('view') ?? localStorage.getItem('weddings-view'); if (v) view(v); } catch {}
</script>
</body>
</html>

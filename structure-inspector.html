<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structure Inspector — Minecraft in the browser</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #141a24; color: #cbd5e1; }
  header { padding: 10px 14px; border-bottom: 1px solid #263243; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0; color: #e2e8f0; }
  header span { color: #7f8ea3; }
  #layout { display: grid; grid-template-columns: 250px 1fr 330px; gap: 0; height: calc(100vh - 41px); }
  .panel { overflow-y: auto; padding: 10px 12px; }
  #controls { border-right: 1px solid #263243; }
  #info { border-left: 1px solid #263243; }
  #view { position: relative; }
  #view canvas { display: block; }
  fieldset { border: 1px solid #2c3a4d; border-radius: 4px; margin: 0 0 10px; padding: 8px 9px; }
  legend { color: #93a4b8; padding: 0 4px; }
  label { display: block; margin: 6px 0 2px; color: #93a4b8; }
  input[type=text], input[type=number], select { width: 100%; background: #0f1620; border: 1px solid #33445a; color: #e2e8f0; padding: 4px 6px; border-radius: 3px; font: inherit; }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  button { width: 100%; margin-top: 6px; background: #1e2a3a; border: 1px solid #3a4c63; color: #e2e8f0; padding: 5px 8px; border-radius: 3px; font: inherit; cursor: pointer; }
  button:hover { background: #26364a; }
  button.primary { background: #1d4ed8; border-color: #2563eb; }
  button.primary:hover { background: #2563eb; }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 3px 0; color: #cbd5e1; }
  .checks input { flex: none; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: #cbd5e1; }
  .muted { color: #7f8ea3; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { text-align: left; padding: 2px 4px; border-bottom: 1px solid #23303f; vertical-align: top; }
  th { color: #93a4b8; font-weight: 600; }
  tr.selected { background: #1e3a8a; }
  tbody tr:hover { background: #1c2a3b; cursor: pointer; }
  #legend div { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
  #determinism { color: #7f8ea3; }
  #determinism.ok { color: #34d399; }
  #determinism.bad { color: #f87171; font-weight: 700; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #93a4b8; margin: 12px 0 4px; }
  h2:first-child { margin-top: 0; }
</style>
</head>
<body>
<header>
  <h1>Structure Inspector</h1>
  <span id="version-note"></span>
</header>
<div id="layout">
  <div class="panel" id="controls">
    <fieldset>
      <legend>Structure</legend>
      <label for="structure">registry id</label>
      <select id="structure"></select>
      <div class="row">
        <div><label for="seed">seed</label><input type="text" id="seed" value="4242"></div>
      </div>
      <div class="row">
        <div><label for="chunk-x">chunk X</label><input type="number" id="chunk-x" value="0"></div>
        <div><label for="chunk-z">chunk Z</label><input type="number" id="chunk-z" value="0"></div>
      </div>
      <div class="row">
        <div><label for="biome">biome</label><input type="text" id="biome" value="plains"></div>
        <div><label for="surface">surface Y</label><input type="number" id="surface" value="70"></div>
      </div>
      <button class="primary" id="btn-nearest">Find nearest</button>
      <button id="btn-chunk">Plan this chunk</button>
      <button id="btn-realize">Realize blocks</button>
      <button id="btn-determinism">Determinism check</button>
      <div id="determinism" class="muted">not run</div>
    </fieldset>

    <fieldset class="checks">
      <legend>Overlays</legend>
      <label><input type="checkbox" id="show-candidates" checked> structure-set candidates</label>
      <label><input type="checkbox" id="show-chunks" checked> chunks touched</label>
      <label><input type="checkbox" id="show-pieces" checked> piece boxes</label>
      <label><input type="checkbox" id="show-start" checked> start box (inflated)</label>
      <button id="btn-reset-view">Reset view</button>
    </fieldset>

    <fieldset>
      <legend>Placement</legend>
      <pre id="placement-info" class="muted">—</pre>
    </fieldset>

    <fieldset>
      <legend>Events</legend>
      <h3>Plan summary</h3>
      <div id="plan-summary" class="muted">no plan</div>
      <h3>Piece graph <span class="muted">(parent, depth, connectors)</span></h3>
      <pre id="piece-graph" class="muted">plan a structure first</pre>
      <h3>Terrain adaptation</h3>
      <div id="adaptation-info" class="muted">not shown: plan a structure first</div>
      <pre id="events" class="muted">—</pre>
    </fieldset>
  </div>

  <div id="view"></div>

  <div class="panel" id="info">
    <h2>Plan</h2>
    <pre id="plan-info" class="muted">—</pre>

    <h2>Pieces</h2>
    <table><tbody id="piece-table"></tbody></table>

    <h2>Blocks rendered</h2>
    <div id="legend" class="muted">—</div>

    <h2>Clicked block</h2>
    <pre id="block-info" class="muted">—</pre>

    <h2>Candidate chunks</h2>
    <pre id="candidate-info" class="muted">—</pre>
  </div>
</div>
<script type="module" src="/src/structureInspector.js"></script>
</body>
</html>

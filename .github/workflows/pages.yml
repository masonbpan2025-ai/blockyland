# Builds the game and publishes it to GitHub Pages. The site is served at https://<owner>.github.io/<repo>/.
# Cloudflare Pages and its Worker are deployed separately (see docs/deploy-cloudflare.md) and are not touched here.
name: Deploy game to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the game under the repository's sub-path
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Stop GitHub Pages from ignoring folders that start with an underscore
        run: touch dist/.nojekyll

      - name: Enable GitHub Pages for this repository
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html><html><head><meta charset="utf-8"><title>Water flow verification</title><style>body{margin:0;background:#90bcd2;font:14px system-ui}nav{position:absolute;background:#172532ed;color:white;padding:12px;z-index:2}button{padding:9px;margin:3px}</style></head><body><nav><button id="break">Break aquarium wall</button><button id="seal">Seal wall</button><button id="pour">Pour bucket</button><button id="collect">Collect source</button><button id="advance">Advance 5 seconds</button><span id="status">Loading…</span></nav><script type="module">
import * as THREE from 'three';
import {World,Chunk} from '../src/world.js';import {BLOCKS} from '../src/blocks.js';import {TextureManager} from '../src/textures.js';import {ChunkMesher} from '../src/mesher.js';import {configureSunShadows,followSun} from '../src/lighting.js';import {Inventory} from '../src/inventory.js';import {useBucket,traceBucket} from '../src/buckets.js';
const world=new World();for(let cx=0;cx<2;cx++){const c=new Chunk(cx,0);world.chunks.set(`${cx},0`,c);for(let x=0;x<16;x++)for(let z=0;z<16;z++)c.setVoxel(x,0,z,BLOCKS.SAND);}
for(let x=3;x<=9;x++)for(let z=3;z<=9;z++){world.setVoxel(x,3,z,BLOCKS.STONE_BRICKS);for(let y=4;y<=7;y++)world.setVoxel(x,y,z,x===3||x===9||z===3||z===9?BLOCKS.GLASS:BLOCKS.WATER);}
const scene=new THREE.Scene();scene.background=new THREE.Color('#9ac3d7');scene.fog=new THREE.Fog('#9ac3d7',50,100);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,150);camera.position.set(24,16,24);camera.lookAt(10,2.4,7);
const sun=new THREE.DirectionalLight(0xffecc4,1.1);scene.add(sun);scene.add(new THREE.AmbientLight(0xffffff,.5));configureSunShadows(sun,scene);followSun(sun,new THREE.Vector3(.5,1,.3).normalize(),new THREE.Vector3(10,2,7));
const tm=new TextureManager();await tm.init();const mesher=new ChunkMesher(tm);const meshes=new Map();
function rebuild(){for(const [key,chunk] of world.chunks){if(!chunk.dirty)continue;for(const mesh of meshes.get(key)||[]){scene.remove(mesh);mesh.geometry.dispose();}const output=mesher.meshChunk(chunk,world),list=[];for(const [name,mat]of [['opaqueGeo',tm.opaqueMaterial],['transparentGeo',tm.transparentMaterial],['waterGeo',tm.waterMaterial]]){if(!output[name])continue;const mesh=new THREE.Mesh(output[name],mat);mesh.castShadow=name!=='waterGeo';mesh.receiveShadow=true;mesh.renderOrder=name==='waterGeo'?1:name==='transparentGeo'?2:0;scene.add(mesh);list.push(mesh);}meshes.set(key,list);chunk.dirty=false;}}
const inv=new Inventory({});inv.hotbar.fill(null);inv.storage.fill(null);let bucketStatus='';
function bucket(id){inv.hotbar[0]={id,isBlock:false,count:1};const hit=traceBucket(world,new THREE.Vector3(20.5,5,7.5),new THREE.Vector3(0,-1,0),id==='bucket');useBucket(world,inv,'survival',hit);bucketStatus=inv.getActiveItem().id;}
document.querySelector('#break').onclick=()=>{for(let z=5;z<=7;z++)world.setVoxel(9,4,z,BLOCKS.AIR);};
document.querySelector('#seal').onclick=()=>{for(let z=5;z<=7;z++)world.setVoxel(9,4,z,BLOCKS.GLASS);};
document.querySelector('#pour').onclick=()=>bucket('water_bucket');document.querySelector('#collect').onclick=()=>bucket('bucket');
document.querySelector('#advance').onclick=()=>{for(let i=0;i<20;i++)world.water.update(.25);};
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.1);world.water.update(dt);rebuild();tm.update(dt,sun,scene.background,scene.fog);renderer.render(scene,camera);document.querySelector('#status').textContent=`${bucketStatus} · ${world.water.pending.size} pending updates`;}frame();
</script></body></html>

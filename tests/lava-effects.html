<!doctype html><html><head><title>Lava and liquid visuals</title><style>body{margin:0;font:15px system-ui}nav{position:absolute;z-index:2;background:#192335ed;color:white;padding:12px}button{padding:10px;margin:4px}img{width:40px;height:40px;vertical-align:middle;image-rendering:pixelated}</style></head><body><nav><img src='/assets/blocks/water_icon.svg' alt='Water block'><img src='/assets/blocks/lava_icon.svg' alt='Lava block'><button id='water'>Hold water</button><button id='lava'>Hold lava</button><button id='advance'>Advance lava flow</button><button id='fire'>Ignite tree</button></nav><script type='module'>
import * as THREE from 'three';import {World,Chunk}from '../src/world.js';import{BLOCKS}from '../src/blocks.js';import{TextureManager}from '../src/textures.js';import{ChunkMesher}from '../src/mesher.js';import{HeldItemRenderer}from '../src/heldItem.js';import{BlockLighting}from '../src/lighting.js';
const world=new World(),chunk=new Chunk(0,0);world.chunks.set('0,0',chunk);for(let x=0;x<16;x++)for(let z=0;z<16;z++)chunk.setVoxel(x,0,z,BLOCKS.STONE_BRICKS);
world.setVoxel(6,1,6,BLOCKS.LAVA);for(let y=1;y<5;y++)world.setVoxel(8,y,7,BLOCKS.OAK_LOG);for(let x=7;x<=9;x++)for(let z=6;z<=8;z++)world.setVoxel(x,5,z,BLOCKS.OAK_LEAVES);
const scene=new THREE.Scene();scene.background=new THREE.Color('#263441');const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.set(15,11,17);camera.lookAt(7,1.5,6);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.autoClear=false;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;document.body.appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,.5));const sun=new THREE.DirectionalLight(0xffedc2,.8);sun.position.set(10,20,5);scene.add(sun);
const tm=new TextureManager();await tm.init();const mesher=new ChunkMesher(tm),lights=new BlockLighting(scene),held=new HeldItemRenderer(camera,tm);held.setItem({id:BLOCKS.WATER,isBlock:true});const meshes=[];
function rebuild(){if(!chunk.dirty)return;for(const m of meshes){scene.remove(m);m.geometry.dispose();}meshes.length=0;const g=mesher.meshChunk(chunk,world);for(const [key,mat]of [['opaqueGeo',tm.opaqueMaterial],['transparentGeo',tm.transparentMaterial],['lightGeo',tm.lightMaterial]]){if(!g[key])continue;const m=new THREE.Mesh(g[key],mat);m.castShadow=m.receiveShadow=true;if(key==='lightGeo')m.customDistanceMaterial=tm.lightDistanceMaterial;scene.add(m);meshes.push(m);}lights.setChunk(0,0,g.lightGeo?.userData.sources||[]);chunk.dirty=false;}
document.querySelector('#water').onclick=()=>held.setItem({id:BLOCKS.WATER,isBlock:true});document.querySelector('#lava').onclick=()=>held.setItem({id:BLOCKS.LAVA,isBlock:true});document.querySelector('#advance').onclick=()=>{for(let i=0;i<36;i++)world.water.update(.25);};document.querySelector('#fire').onclick=()=>{world.lava.ignite(8,2,8);};const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.1);world.water.update(dt);rebuild();lights.update(dt,camera.position);tm.update(dt,sun,scene.background);held.update(dt,0);renderer.clear();renderer.render(scene,camera);held.render(renderer);}frame();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>Lightweight shader preview</title><style>body{margin:0;background:#182632}aside{position:absolute;z-index:2;left:18px;top:18px;background:#14243be8;padding:16px;border-radius:10px;color:white;font:15px system-ui}button{padding:9px;margin:4px;border:0;border-radius:4px}p{margin:5px 0}#pause{display:none;margin-top:8px}</style></head><body><aside><b>Lightweight shader preview</b><p>Press ESC for shader settings</p><button id="noon">Day</button><button id="sunset">Sunset</button><button id="night">Night</button><button id="rain">Rain / clear</button><div id="pause"><button id="btn-shader" aria-pressed="false">Lightweight Shader: OFF</button></div><p id="status"></p></aside><script type="module">
import * as THREE from 'three';import {World,Chunk} from '/src/world.js';import {BLOCKS as B} from '/src/blocks.js';import {TextureManager} from '/src/textures.js';import {ChunkMesher} from '/src/mesher.js';import {Sky} from '/src/sky.js';import {WeatherManager} from '/src/weather.js';import {BlockLighting,configureSunShadows,followSun} from '/src/lighting.js';import {LightweightShader} from '/src/lightweightShader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cbed5);scene.fog=new THREE.Fog(0x9cbed5,35,120);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);camera.position.set(16,5,9);camera.lookAt(0,2.6,8);const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.autoClear=false;renderer.shadowMap.type=THREE.PCFShadowMap;document.body.appendChild(renderer.domElement);
const world=new World();for(let x=-1;x<2;x++)for(let z=-1;z<2;z++)world.chunks.set(world.chunkKey(x,z),new Chunk(x,z));
for(let x=-16;x<25;x++)for(let z=-10;z<25;z++){world.setVoxel(x,0,z,B.DIRT);world.setVoxel(x,1,z,x>=0&&x<13&&z>3&&z<13?B.WATER:B.GRASS);}
for(const [x,z]of [[-3,5],[-4,12],[2,1],[8,17],[15,16]]){for(let y=2;y<6;y++)world.setVoxel(x,y,z,B.OAK_LOG);for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let y=5;y<8;y++)if(Math.abs(dx)+Math.abs(dz)<4)world.setVoxel(x+dx,y,z+dz,B.OAK_LEAVES);}
for(let x=1;x<8;x++)world.setVoxel(x,2,15,B.POPPY);world.setVoxel(12,2,3,B.TORCH);world.setVoxel(15,2,4,B.GLOWSTONE);
const textures=new TextureManager();await textures.init();const sky=new Sky(scene),sunLight=new THREE.DirectionalLight(0xffdb9a,1),ambient=new THREE.AmbientLight(0xffffff,.4);scene.add(sunLight,ambient);configureSunShadows(sunLight,scene);const blockLighting=new BlockLighting(scene),weather=new WeatherManager(scene,{startRainSound(){},stopRainSound(){},playThunder(){}}),mesher=new ChunkMesher(textures);
for(const c of world.chunks.values()){const geos=mesher.meshChunk(c,world);for(const [k,mat]of [['opaqueGeo',textures.opaqueMaterial],['transparentGeo',textures.transparentMaterial],['waterGeo',textures.waterMaterial],['lightGeo',textures.lightMaterial]])if(geos[k]){const m=new THREE.Mesh(geos[k],mat);m.castShadow=k!=='waterGeo';m.receiveShadow=true;scene.add(m);}blockLighting.setChunk(c.cx,c.cz,geos.lightGeo?.userData.sources||[]);}
const game={scene,camera,renderer,sky,sunLight,blockLighting,textures,weather};const shader=new LightweightShader(game,{storage:{getItem:()=>null,setItem(){}}});shader.bindButton(document.querySelector('#btn-shader'));let time=11700;document.querySelector('#noon').onclick=()=>time=6000;document.querySelector('#sunset').onclick=()=>time=11700;document.querySelector('#night').onclick=()=>time=18000;document.querySelector('#rain').onclick=()=>weather.setWeather(weather.weatherType==='clear'?'rain':'clear');window.addEventListener('keydown',e=>{if(e.key==='Escape'){const p=document.querySelector('#pause');p.style.display=p.style.display==='block'?'none':'block';}});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
let previous=performance.now();function frame(){requestAnimationFrame(frame);const now=performance.now(),dt=Math.min(.1,(now-previous)/1000);previous=now;sky.setTime(time);followSun(sunLight,sky.sunDirection,camera.position);ambient.intensity=.1+sky.uniforms.uDay.value*(shader.enabled?.34:.48);sunLight.intensity=Math.max(0,sky.sunDirection.y)*(shader.enabled?1.12:.85);sunLight.color.setRGB(1,.65+.27*sky.uniforms.uDay.value,.28+.44*sky.uniforms.uDay.value);scene.background.copy(sky.horizonColor);scene.fog.color.copy(sky.horizonColor);weather.update(dt,camera.position,ambient,sunLight,scene.fog,scene.background);sky.update(dt,camera,weather,false);blockLighting.update(dt,camera.position);textures.update(dt,sunLight,scene.background,scene.fog);shader.render(dt);document.querySelector('#status').textContent=shader.enabled?'Shader ON · animated water, atmosphere and shadows':'Shader OFF · basic rendering';}frame();
</script></body></html>

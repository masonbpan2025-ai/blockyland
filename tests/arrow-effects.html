<!doctype html><html><head><title>Arrow visual check</title><style>body{margin:0;background:#233142}aside{position:absolute;padding:16px;color:white;font:16px sans-serif}button{padding:10px;margin:4px}</style></head><body><aside><button id="fire">Shoot arrows</button><button id="aim">Draw bow / zoom</button><button id="release">Release bow</button><div id="status">70 degree view</div></aside><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';import {spawnArrow,updateArrows} from '/src/arrows.js';import {bowFov} from '/src/bow.js';import {BLOCKS} from '/src/blocks.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x233142);scene.add(new THREE.HemisphereLight(0xffffff,0x526044,3));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,9,5);scene.add(sun);
const floor=new THREE.Mesh(new THREE.BoxGeometry(16,1,20),new THREE.MeshLambertMaterial({color:0x62745c}));floor.position.y=-.5;scene.add(floor);scene.add(new THREE.GridHelper(20,20,0x9ca58f,0x78876d));
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);camera.position.set(6,4,9);camera.lookAt(0,1,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const manager={scene,world:{getVoxel:(x,y,z)=>y<0?BLOCKS.STONE:0},sounds:{},mobs:[],arrows:[]},player={position:new THREE.Vector3(100,0,0)};
function fire(){for(let i=0;i<5;i++)spawnArrow(manager,new THREE.Vector3(-2+i,2,-5),new THREE.Vector3(.05,-.14,1),{}, {speed:8});}document.querySelector('#fire').onclick=fire;let draw=0,target=0;document.querySelector('#aim').onclick=()=>target=1;document.querySelector('#release').onclick=()=>{target=0;fire();};fire();const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(.05,clock.getDelta());updateArrows(manager,dt,player);draw+=(target-draw)*(1-Math.exp(-5*dt));camera.fov=bowFov(70,draw);camera.updateProjectionMatrix();document.querySelector('#status').textContent=camera.fov.toFixed(1)+' degree view';renderer.render(scene,camera);}frame();
</script></body></html>

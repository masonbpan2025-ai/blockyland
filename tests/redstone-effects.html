<!doctype html><html><head><meta charset="utf-8"><title>Redstone workshop</title><style>body{margin:0;background:#243245}aside{position:absolute;z-index:2;left:20px;top:20px;padding:18px;background:#102035e8;color:#fff;font:16px system-ui;border-radius:12px}button{padding:10px 14px;margin:4px;border:0;border-radius:6px}p{margin:8px 0;font-size:13px}</style></head><body><aside><b>Redstone workshop</b><p>Lever → wire → lamp · Piston elevator · Observer flying engine</p><button id="lever">Toggle circuit</button><button id="lift">Raise / lower elevator</button><button id="fly">Launch flying engine</button><p id="status">Circuit OFF</p></aside><script type="module">
import * as THREE from 'three';import {World,Chunk} from '/src/world.js';import {BLOCKS as B} from '/src/blocks.js';import {TextureManager} from '/src/textures.js';import {ChunkMesher} from '/src/mesher.js';import {BlockLighting} from '/src/lighting.js';import {buildRedstoneDemo} from '/src/redstoneDemos.js';
const world=new World(),scene=new THREE.Scene();scene.background=new THREE.Color(0x243245);scene.add(new THREE.HemisphereLight(0xb7d8ff,0x626c43,2));const sun=new THREE.DirectionalLight(0xffe9b0,3);sun.position.set(5,18,8);scene.add(sun);
for(let x=0;x<2;x++)for(let z=0;z<2;z++){const c=new Chunk(x,z);world.chunks.set(x+','+z,c);for(let i=0;i<16;i++)for(let j=0;j<16;j++)c.setVoxel(i,0,j,B.STONE_BRICKS);}
const tm=new TextureManager();await tm.init();const mesher=new ChunkMesher(tm),lights=new BlockLighting(scene,8),camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);camera.position.set(15,11,18);camera.lookAt(7,1,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
world.setVoxel(2,1,3,B.LEVER);for(let x=3;x<8;x++)world.setVoxel(x,1,3,B.REDSTONE_WIRE);world.setVoxel(8,1,3,B.REDSTONE_LAMP);buildRedstoneDemo(world,'elevator',[12,1,8]);world.setVoxel(11,1,3,B.REPEATER);world.setVoxel(12,1,3,B.COMPARATOR);world.setVoxel(13,1,3,B.OBSERVER);
document.querySelector('#lever').onclick=()=>{document.querySelector('#status').textContent=world.redstone.interact([2,1,3]);};document.querySelector('#lift').onclick=()=>world.redstone.interact([11,1,8]);document.querySelector('#fly').onclick=()=>{try{buildRedstoneDemo(world,'flyer',[14,1,3]);}catch{}};
function rebuild(){for(const c of world.chunks.values())if(c.dirty){for(const m of c.preview||[]){scene.remove(m);m.geometry.dispose();}c.preview=[];const geos=mesher.meshChunk(c,world);for(const [key,mat] of [['opaqueGeo',tm.opaqueMaterial],['transparentGeo',tm.transparentMaterial],['lightGeo',tm.lightMaterial]])if(geos[key]){const mesh=new THREE.Mesh(geos[key],mat);scene.add(mesh);c.preview.push(mesh);}lights.setChunk(c.cx,c.cz,geos.lightGeo?.userData.sources||[]);c.dirty=false;}}
let before=performance.now();function frame(){requestAnimationFrame(frame);const now=performance.now(),dt=Math.min(.1,(now-before)/1000);before=now;world.redstone.update(dt);rebuild();lights.update(dt,camera.position);tm.update(dt);renderer.render(scene,camera);}frame();
</script></body></html>
